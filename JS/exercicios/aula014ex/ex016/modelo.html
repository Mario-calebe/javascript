<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contagem de passos!</h1>
    </header>
    <section>
        <div>
            <p>
                <label for="inicio">Espaço inicial:</label>
                <input type="number" name="start" id="inicio">
            </p>
            <p>
                <label for="fim">Espaço final:</label>
                <input type="number" name="end" id="fim">
            </p>    
            <p>
                <label for="passo">Passo:</label>
                <input type="number" name="step" id="passo">
            </p>
            <p>
                <input type="button" value="Contar" onclick="contar()">
            </p>
        </div>
        <div id="res">
            Escolha o Inicio, Fim, e quantos passos por vez!
        </div>
    </section>
    <footer>
        <p>&copy;Curso em Video</p>
    </footer>

</body>
<script src="Script.js"></script>
</html>
